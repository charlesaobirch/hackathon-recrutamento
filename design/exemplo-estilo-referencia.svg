  <path d="M426 409v25q0 12 12 12h19q12 0 12 12v8" fill="none" stroke="#a9aa9e" stroke-width="1.2"/>
  <rect x="352" y="466" width="226" height="91" rx="20" fill="#f9f9f3" filter="url(#shadow)"/><circle cx="378" cy="492" r="14" fill="#e5e7db"/><text x="378" y="496" text-anchor="middle" font-size="13">↗</text><text x="402" y="491" class="small strong">Rui Costa</text><text x="371" y="518" class="micro muted">Data Engineer · V0076 · CL02</text><rect x="371" y="530" width="65" height="18" rx="9" fill="#e9eddf"/><text x="403" y="543" text-anchor="middle" class="micro">5 dias</text>
  <path d="M694 409v26q0 12 12 12h20q12 0 12 12v7" fill="none" stroke="#a9aa9e" stroke-width="1.2"/>
  <rect x="614" y="466" width="246" height="91" rx="20" fill="#f9f9f3" stroke="#d2b3a4" stroke-width="1.4" filter="url(#shadow)"/><circle cx="640" cy="492" r="14" fill="#d1ff22"/><text x="640" y="496" text-anchor="middle" font-size="13">!</text><text x="664" y="491" class="small strong">Inês Carvalho</text><text x="633" y="518" class="micro muted">Senior Data Eng. · V0184 · CL09</text><rect x="633" y="530" width="74" height="18" rx="9" fill="#d1ff22"/><text x="670" y="543" text-anchor="middle" class="micro" font-weight="700">+6 d SLA</text>
  <path d="M962 409v25q0 12 12 12h15q12 0 12 12v8" fill="none" stroke="#a9aa9e" stroke-width="1.2"/>
  <rect x="890" y="466" width="226" height="91" rx="20" fill="#f9f9f3" filter="url(#shadow)"/><circle cx="916" cy="492" r="14" fill="#e5e7db"/><text x="916" y="496" text-anchor="middle" font-size="13">↗</text><text x="940" y="491" class="small strong">Marta Lopes</text><text x="909" y="518" class="micro muted">Engineering Mgr · V0122</text><rect x="909" y="530" width="65" height="18" rx="9" fill="#e9eddf"/><text x="941" y="543" text-anchor="middle" class="micro">6 dias</text>
  <path d="M1230 409v25q0 12 12 12h13q12 0 12 12v8" fill="none" stroke="#a9aa9e" stroke-width="1.2"/>
  <rect x="1168" y="466" width="204" height="91" rx="20" fill="#f9f9f3" filter="url(#shadow)"/><circle cx="1194" cy="492" r="14" fill="#e5e7db"/><text x="1194" y="496" text-anchor="middle" font-size="13">↗</text><text x="1218" y="491" class="small strong">Tiago Mendes</text><text x="1187" y="518" class="micro muted">Data Engineer · V0231</text><rect x="1187" y="530" width="65" height="18" rx="9" fill="#d1ff22"/><text x="1219" y="543" text-anchor="middle" class="micro" font-weight="700">+3 d SLA</text>
  <!-- lower detail strip: focus + quality -->
  <rect x="70" y="589" width="830" height="292" rx="27" fill="#f8f8f2"/>
  <text x="98" y="626" font-size="16" font-weight="650">Candidatura selecionada</text><text x="98" y="648" class="small muted">Inês Carvalho · AP004821 · próxima intervenção em falta</text>
  <line x1="119" y1="682" x2="119" y2="821" stroke="#b5b7a9" stroke-width="1.5"/>
  <circle cx="119" cy="688" r="8" fill="#d1ff22"/><text x="145" y="685" class="small strong">Entrevista com cliente</text><text x="145" y="703" class="micro muted">12 nov · feedback positivo · CL09</text>
  <circle cx="119" cy="736" r="8" fill="#d1ff22"/><text x="145" y="733" class="small strong">Decisão pendente</text><text x="145" y="751" class="micro muted">13 dias sem ação · SLA ultrapassado há 6 dias</text>
  <circle cx="119" cy="784" r="8" fill="#292b26"/><text x="145" y="781" class="small strong">Validar oferta €76 500</text><text x="145" y="799" class="micro muted">€2 500 acima do máximo da banda · aprovação necessária</text>
  <rect x="617" y="675" width="251" height="153" rx="20" fill="#e7e8dc"/><text x="640" y="704" class="label">AÇÃO RECOMENDADA</text><text x="640" y="731" class="body strong">Rever a proposta</text><text x="640" y="752" class="small muted">ou pedir aprovação formal</text><rect x="640" y="774" width="205" height="36" rx="18" fill="#d1ff22"/><text x="742" y="797" text-anchor="middle" class="pilltext">Abrir validação salarial →</text>
  <rect x="922" y="589" width="450" height="292" rx="27" fill="#292b26"/>
  <text x="950" y="626" font-size="16" font-weight="650" fill="#fff">Integridade dos dados</text><rect x="1248" y="605" width="94" height="25" rx="12" fill="#d1ff22"/><text x="1295" y="622" text-anchor="middle" class="micro" font-weight="750">4 P0 abertas</text>
  <circle cx="958" cy="667" r="5" fill="#d1ff22"/><text x="974" y="671" font-size="12" font-weight="600" fill="#fff">V999 · 330 candidaturas sem vaga válida</text><text x="974" y="689" font-size="10" fill="#bfc1b5">Excluídas de indicadores oficiais até correção</text>
  <circle cx="958" cy="718" r="5" fill="#d1ff22"/><text x="974" y="722" font-size="12" font-weight="600" fill="#fff">Etapa atual não fiável</text><text x="974" y="740" font-size="10" fill="#bfc1b5">Usar sequência de entrevistas para derivar fase</text>
  <circle cx="958" cy="769" r="5" fill="#d1ff22"/><text x="974" y="773" font-size="12" font-weight="600" fill="#fff">Estados de candidato incoerentes</text><text x="974" y="791" font-size="10" fill="#bfc1b5">864 marcados como contratados vs. 254 reais</text>
  <text x="950" y="842" font-size="11" font-weight="600" fill="#d1ff22">Abrir registo de anomalias e plano de correção →</text>
