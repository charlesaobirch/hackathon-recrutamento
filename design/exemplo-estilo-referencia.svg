<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">TalentFlow no estilo da referência visual</title>
  <desc id="desc">Dashboard de recrutamento com moldura grafite, superfícies marfim, navegação em cápsulas, destaque lima e percurso de candidatura ligado por uma timeline.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#42433c" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#20221e}.muted{fill:#77796e}.micro{font-size:10px}.small{font-size:12px}.label{font-size:10px;font-weight:700;letter-spacing:.09em;fill:#787a70}.body{font-size:13px}.strong{font-weight:650}.title{font-size:26px;font-weight:650;letter-spacing:-.035em}.pilltext{font-size:11px;font-weight:600}.metric{font-size:24px;font-weight:650;letter-spacing:-.04em}.stroke{stroke:#d9d9ce}
    </style>
  </defs>
  <!-- outer device-like frame and warm canvas -->
  <rect x="8" y="8" width="1424" height="984" rx="48" fill="#262824"/>
  <rect x="21" y="21" width="1398" height="958" rx="39" fill="#e6e5dc"/>
  <!-- header -->
  <circle cx="54" cy="55" r="25" fill="#fff"/><path d="M49 50l10 10m0-10L49 60" stroke="#343630" stroke-width="1.7" stroke-linecap="round"/>
  <text x="96" y="64" font-size="27" font-weight="550" letter-spacing="-.04em">TalentFlow</text>
  <rect x="355" y="33" width="168" height="44" rx="22" fill="#fff"/><text x="379" y="60" class="pilltext">⌕  Pesquisar</text>
  <rect x="534" y="33" width="137" height="44" rx="22" fill="#fff"/><text x="557" y="60" class="pilltext">▦  Visão geral</text>
  <rect x="682" y="33" width="112" height="44" rx="22" fill="#d1ff22"/><text x="708" y="60" class="pilltext">◫  Pipeline</text>
  <rect x="805" y="33" width="145" height="44" rx="22" fill="#fff"/><text x="828" y="60" class="pilltext">♙  Candidaturas</text>
  <rect x="961" y="33" width="120" height="44" rx="22" fill="#fff"/><text x="985" y="60" class="pilltext">▱  Propostas</text>
  <rect x="1092" y="33" width="116" height="44" rx="22" fill="#fff"/><text x="1116" y="60" class="pilltext">♧  Clientes</text>
  <rect x="1219" y="33" width="150" height="44" rx="22" fill="#fff"/><text x="1241" y="60" class="pilltext">◇  Qualidade</text>
  <!-- page heading and context -->
  <text x="70" y="131" class="title">Pipeline de recrutamento</text>
  <text x="70" y="155" class="small muted">Fases derivadas das entrevistas · atualizado hoje, 09:42</text>
  <rect x="1110" y="103" width="259" height="43" rx="21" fill="#fff"/><text x="1133" y="130" class="pilltext">Todos os clientes     ⌄</text>
  <!-- candidate overview -->
  <rect x="70" y="178" width="255" height="100" rx="25" fill="#f8f8f2"/>
  <circle cx="119" cy="228" r="29" fill="#d9d9cd"/><circle cx="119" cy="218" r="10" fill="#f3c9ad"/><path d="M99 245c2-15 12-20 20-20s18 5 20 20" fill="#54685c"/>
  <text x="164" y="211" class="micro muted">CANDIDATURA EM FOCO</text><text x="164" y="233" class="body strong">Inês Carvalho</text><text x="164" y="253" class="small muted">V0184 · CL09 · R07</text>
  <!-- high-level summary -->
  <text x="373" y="205" class="micro muted">CANDIDATURAS</text><text x="373" y="235" class="metric">5 962</text><text x="373" y="257" class="micro muted">10 clientes · 10 recrutadores</text>
  <text x="554" y="205" class="micro muted">EM ATRASO</text><text x="554" y="235" class="metric">34</text><rect x="600" y="243" width="65" height="20" rx="10" fill="#d1ff22"/><text x="632" y="257" text-anchor="middle" class="micro" font-weight="700">12 SLA+</text>
  <text x="733" y="205" class="micro muted">ESPERA ATÉ PROPOSTA</text><text x="733" y="235" class="metric">27 dias</text><text x="733" y="257" class="micro muted">68% do ciclo de 40 dias</text>
  <text x="963" y="205" class="micro muted">FORA DA BANDA</text><text x="963" y="235" class="metric">20,4%</text><text x="963" y="257" class="micro muted">207 propostas · requer revisão</text>
  <rect x="1198" y="188" width="171" height="70" rx="22" fill="#292b26"/><circle cx="1223" cy="223" r="13" fill="#d1ff22"/><text x="1223" y="228" text-anchor="middle" font-size="15" font-weight="700">!</text><text x="1245" y="216" font-size="11" font-weight="650" fill="#fff">4 bloqueios P0</text><text x="1245" y="235" font-size="10" fill="#d7d8ce">métricas provisórias</text>
  <!-- pipeline timeline -->
  <text x="70" y="324" font-size="17" font-weight="650">Percurso das candidaturas</text>
  <text x="70" y="345" class="small muted">Seleciona uma etapa para ver o detalhe e a próxima ação.</text>
  <rect x="1092" y="300" width="128" height="34" rx="17" fill="#fff"/><text x="1114" y="322" class="pilltext">SLA ultrapassado</text><rect x="1228" y="300" width="141" height="34" rx="17" fill="#fff"/><text x="1250" y="322" class="pilltext">＋ Mais filtros</text>
  <line x1="112" y1="390" x2="1321" y2="390" stroke="#a6a99b" stroke-width="2"/>
  <line x1="112" y1="390" x2="770" y2="390" stroke="#a6bf5a" stroke-width="2"/>
  <!-- stage markers -->
  <circle cx="158" cy="390" r="18" fill="#d1ff22"/><text x="158" y="394" text-anchor="middle" class="micro" font-weight="750">28</text><text x="126" y="425" class="body strong">Triagem</text><text x="126" y="442" class="micro muted">mediana 2 dias</text>
  <circle cx="426" cy="390" r="18" fill="#d1ff22"/><text x="426" y="394" text-anchor="middle" class="micro" font-weight="750">19</text><text x="374" y="425" class="body strong">Entrevista técnica</text><text x="374" y="442" class="micro muted">mediana 5 dias</text>
  <circle cx="694" cy="390" r="18" fill="#d1ff22"/><text x="694" y="394" text-anchor="middle" class="micro" font-weight="750">16</text><text x="644" y="425" class="body strong">Entrevista cliente</text><text x="644" y="442" class="micro muted">mediana 7 dias</text>
  <circle cx="962" cy="390" r="18" fill="#f8f8f2" stroke="#a6a99b" stroke-width="1.5"/><text x="962" y="394" text-anchor="middle" class="micro" font-weight="750">12</text><text x="929" y="425" class="body strong">Entrevista final</text><text x="929" y="442" class="micro muted">gargalo a validar</text>
  <circle cx="1230" cy="390" r="18" fill="#f8f8f2" stroke="#a6a99b" stroke-width="1.5"/><text x="1230" y="394" text-anchor="middle" class="micro" font-weight="750">8</text><text x="1209" y="425" class="body strong">Proposta</text><text x="1209" y="442" class="micro muted">mediana 27 dias</text>
